[package]
name = "virgostars-events-generator"
description = "Offline candidate discovery from replaceable ephemeris position providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
virgostars-events-core = { path = "../events-core" }
virgostars-event-ephemeris = { path = "../events-rust" }
virgostars-events-p0 = { path = "../events-p0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
base64 = "0.22"

[lib]
path = "src/lib.rs"

[[bin]]
name = "vseph-generate-candidates"
path = "src/main.rs"

[[bin]]
name = "vseph-fill-gaps"
path = "src/fill_gaps.rs"
