[package]
name = "virgostars-events-generator"
description = "Offline candidate discovery from replaceable ephemeris position providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
virgostars-events-core = { path = "../events-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lib]
path = "src/lib.rs"

[[bin]]
name = "vseph-generate-candidates"
path = "src/main.rs"
