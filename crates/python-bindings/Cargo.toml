[package]
name = "virgostars-events-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Python bindings for the offline VirgoStars event-ephemeris reader"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24.2", features = ["extension-module", "abi3-py310"] }
serde_json = "1"
virgostars-events-core = { path = "../events-core" }
virgostars-events-p0 = { path = "../events-p0" }
